<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="ge-root" content="../">
<script>
  /* troca de aba com efeito de página virando: indo para a direita (Início → Notícias → Temas → Revistas)
     a folha vira para a esquerda; voltando, a folha anterior volta por cima (navegadores com View Transitions) */
  (function () {
    function aba(u) {
      try { var p = new URL(u).pathname; } catch (e) { return -1; }
      if (/\/noticias\/(index\.html)?$/.test(p)) return 1;
      if (/\/artigos\/(index\.html)?$/.test(p)) return 2;
      if (/\/revistas\/(index\.html)?$/.test(p)) return 3;
      if (/\/(sobre|r337h|artigos\/[^/]+)\//.test(p)) return 9;
      return 0;
    }
    addEventListener("pagereveal", function (e) {
      if (!e.viewTransition || !window.navigation || !navigation.activation || !navigation.activation.from) return;
      var de = aba(navigation.activation.from.url), para = aba(navigation.activation.entry.url);
      e.viewTransition.types.add(para < de ? "voltar" : "avancar");
    });
  })();
</script>
<link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GenoEvidence">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Temas · GenoEvidence</title>
<meta name="description" content="Artigos científicos separados por tema (genética, biologia molecular, bioinformática e mais), explicados em linguagem simples, com link direto para a revista.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../assets/css/shell.css">
</head>
<body data-pagina="artigos">
<!-- barra do topo e barra de abas: montadas pelo assets/js/shell.js -->
<header id="appbar"></header>

<main class="wrap">
  <header class="page-head">
    <p class="kicker" id="total">&nbsp;</p>
    <h1>Artigos por tema</h1>
    <p class="sub">Escolha um tema e veja os estudos explicados em linguagem simples. Toque em um estudo para abrir a página completa dele, com imagens, gráficos e o link para a revista.</p>
  </header>

  <!-- temas: montados a partir de data/artigos.json -->
  <nav class="tema-bar" id="temaBar" aria-label="Temas"></nav>

  <div class="temas-tools">
    <input class="search" id="busca" type="search" placeholder="Buscar artigo, revista ou palavra…" aria-label="Buscar artigos">
    <div class="chips pesq-chips" id="porPesquisadora" role="group" aria-label="Filtrar por pesquisadora"></div>
  </div>
  <div id="porTema"><p class="loading">Carregando…</p></div>
</main>

<footer class="foot"><div class="wrap">GenoEvidence · a ciência por trás das evidências · <a href="../sobre/">Sobre o app</a></div></footer>
<nav id="tabbar"></nav>
<script src="../assets/js/shell.js"></script>
<script src="../assets/js/pwa.js"></script>
</body>
</html>
