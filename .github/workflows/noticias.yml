# Atualiza as notícias e os artigos científicos do dia (data/noticias.json).
# Deixa as notícias prontas todo dia até as 7h (horário de Brasília); também roda pelo botão "Run workflow" na aba Actions.
name: Notícias do dia

on:
  schedule:
    # Várias tentativas de manhã, fora do minuto cheio: o GitHub às vezes atrasa agendamentos
    # (em 25/09/2026 o das 7h só rodou às 11h57). Quem rodar primeiro atualiza; as outras só
    # gravam se aparecer notícia nova.
    - cron: "7 9 * * *"    # 06:07 em Brasília
    - cron: "37 9 * * *"   # 06:37
    - cron: "7 10 * * *"   # 07:07
    - cron: "37 10 * * *"  # 07:37
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Buscar notícias e artigos
        run: python3 scripts/atualizar_noticias.py
      - name: Salvar no repositório (só se mudou)
        run: |
          git config user.name "GenoEvidence (robô de notícias)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json data/traducoes.json
          if git diff --cached --quiet; then
            echo "Nada novo hoje."
          else
            git commit -m "Notícias do dia: $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
