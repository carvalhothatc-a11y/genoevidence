# Atualiza as notícias e os artigos científicos do dia (data/noticias.json).
# Atualiza as notícias ao longo do dia (de hora em hora) para estarem prontas cedo; também roda pelo botão "Run workflow" na aba Actions.
name: Notícias do dia

on:
  schedule:
    # O GitHub não garante o horário dos agendamentos: em 25/09/2026 o das 7h só rodou às 11h57
    # e em 26/09 as tentativas da manhã foram descartadas. Por isso o robô tenta de hora em hora
    # (no minuto 23, fora do horário cheio) e só grava quando aparece notícia nova. Assim as
    # notícias do dia ficam prontas cedo, mesmo que algumas tentativas não rodem.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Buscar notícias e artigos
        run: python3 scripts/atualizar_noticias.py
      - name: Salvar no repositório (só se mudou)
        run: |
          git config user.name "GenoEvidence (robô de notícias)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json data/traducoes.json
          if git diff --cached --quiet; then
            echo "Nada novo hoje."
          else
            git commit -m "Notícias do dia: $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
