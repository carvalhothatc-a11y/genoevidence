# Atualiza as notícias e os artigos científicos do dia (data/noticias.json).
# Roda todo dia às 7h (horário de Brasília) e também pelo botão "Run workflow" na aba Actions.
name: Notícias do dia

on:
  schedule:
    - cron: "0 10 * * *"  # 10:00 UTC = 07:00 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Buscar notícias e artigos
        run: python3 scripts/atualizar_noticias.py
      - name: Salvar no repositório (só se mudou)
        run: |
          git config user.name "GenoEvidence (robô de notícias)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json data/traducoes.json
          if git diff --cached --quiet; then
            echo "Nada novo hoje."
          else
            git commit -m "Notícias do dia: $(date -u +%Y-%m-%d)"
            git push
          fi
