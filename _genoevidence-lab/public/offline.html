<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1221" />
    <title>Sem conexão · GenoLab</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: radial-gradient(60% 45% at 90% -10%, rgba(123,77,224,.18), transparent 60%), #060a13; color: #c9d2e3; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 420px; padding: 24px; text-align: center; }
      img { width: 72px; height: 72px; filter: drop-shadow(0 0 18px rgba(123,77,224,.55)); }
      h1 { color: #eef2f9; font-size: 22px; margin: 16px 0 8px; }
      p { margin: 0 0 16px; }
      button { border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 600; color: #fff; background: linear-gradient(100deg, #2F5BEA, #7B4DE0 55%, #E0385A); cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/geno-evidence-simbolo-192.png" alt="" />
      <h1>Sem conexão com a internet</h1>
      <p>O GenoLab precisa de internet para abrir seus projetos com segurança. Nada foi perdido: seus dados ficam guardados no servidor e o rascunho da área de trabalho continua neste computador.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
